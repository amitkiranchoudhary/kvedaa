services:
  # ─── Backend (FastAPI) ───
  - type: web
    name: kvedaa-backend
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn core.apis.api:app --host 0.0.0.0 --port $PORT
    rootDir: backend
    envVars:
      - key: MONGODB_URI
        sync: false  # You'll set this manually in Render dashboard
      - key: DATABASE_NAME
        value: authentication
      - key: secret
        sync: false
      - key: algorithm
        value: HS256
      - key: PYTHON_VERSION
        value: 3.13.0

  # ─── Frontend (Vite/React Static Site) ───
  - type: web
    name: kvedaa-frontend
    runtime: static
    region: oregon
    plan: free
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    rootDir: Frontend
    envVars:
      - key: VITE_API_URL
        sync: false  # Set to your backend URL after deploying
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
